# Copy to .shadow/claims.yaml and edit. JSON works too. See docs/CLAIMS.md.
# agent_note is recorded and ignored. It cannot grant PASS.
version: 1
claims:
  - id: logs-locked
    statement: S3 bucket locked down
    resource_type: s3_bucket
    identifier: logs-prod
    region: us-east-1
    agent_note: Agent says public access is blocked.
    terraform_address: aws_s3_bucket.logs
    expected:
      block_public_acls: true
      ignore_public_acls: true
      block_public_policy: true
      restrict_public_buckets: true
      bucket_policy_public: false
  - id: ssh-closed
    statement: port 22 not open to 0.0.0.0/0
    resource_type: ec2_security_group
    identifier: sg-0123456789abcdef0
    expected:
      ingress_forbidden:
        - protocol: tcp
          from_port: 22
          to_port: 22
          cidr: 0.0.0.0/0
        - protocol: tcp
          from_port: 22
          to_port: 22
          cidr: "::/0"
  - id: deploy-role
    statement: role trusts only GitHub OIDC and has no admin policy
    resource_type: iam_role
    identifier: app-deploy
    expected:
      trust_principals:
        - arn:aws:iam::123456789012:oidc-provider/token.actions.githubusercontent.com
      attached_policy_arns:
        - arn:aws:iam::123456789012:policy/app-deploy
      no_admin_star: true
