# Unit tests only. This does not call AWS.
# Actions minutes on this repository may be blocked by billing. The suite
# is run locally before release; see STATUS.md.
# Windows is in the matrix so a run can be observed. Until that run passes,
# the README says Windows: NOT ASSESSED.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Upgrade pip and setuptools
        run: python -m pip install --upgrade --constraint requirements-ci.txt pip setuptools
      - name: Install
        run: python -m pip install --constraint requirements-ci.txt -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Audit dependencies
        run: python -m pip_audit
