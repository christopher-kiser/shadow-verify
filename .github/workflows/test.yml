# Unit tests only. This does not call AWS.
# Eval tests run in the same pytest invocation.
# 4e8caee was green on ubuntu-latest and windows-latest:
# https://github.com/christopher-kiser/shadow-verify/actions/runs/41836017217
# https://github.com/christopher-kiser/shadow-verify/actions/runs/41836026609
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Upgrade pip and setuptools
        run: python -m pip install --upgrade --constraint requirements-ci.txt pip setuptools
      - name: Install
        run: python -m pip install --constraint requirements-ci.txt -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Audit dependencies
        run: python -m pip_audit
